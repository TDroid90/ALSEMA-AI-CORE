[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alsema-ai-core-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic>=1.15,<2", "arq>=0.26,<1", "asyncpg>=0.30,<1", "cryptography>=44,<46", "email-validator>=2.2,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pillow>=11.1,<12", "psycopg[binary]>=3.2,<4", "pwdlib[argon2]>=0.2,<1", "pydantic-settings>=2.8,<3", "pyjwt>=2.10,<3", "python-multipart>=0.0.20,<1", "redis>=5.2,<7", "rembg[cpu]>=2.0.67,<3", "sqlalchemy>=2.0,<3", "types-jsonschema>=4.23,<5", "uvicorn[standard]>=0.34,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501", "E701", "E702"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
exclude = ["tests"]
